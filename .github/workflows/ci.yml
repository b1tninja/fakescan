name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p fakescan --all-targets -- -D warnings

      - name: test
        run: cargo test -p fakescan

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and compose smoke
        run: |
          docker compose build
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:3920/health
          curl -fsS http://127.0.0.1:3920/v1/status | tee status.json
          grep -q brother-wsd status.json
          curl -fsS -X POST http://127.0.0.1:3920/v1/pages \
            -H 'content-type: application/json' -d '{"count":1}'
          curl -fsS -X POST http://127.0.0.1:3920/ScannerService \
            -H 'content-type: application/soap+xml' \
            --data-binary @scripts/fixtures/get_scanner_elements.xml \
            | tee soap.xml
          grep -q ScannerDescription soap.xml
          docker compose down
