[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakescan"
version = "0.1.0"
description = "Python control-plane client for fakescan (lab / WIA harness; optional)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "fakescan contributors" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]
# SOAP helpers (fakescan.soap) ship with the base package (httpx).
# MCP attach-only server: pip install -e "./python[mcp]"
mcp = ["mcp>=1.0"]

[project.scripts]
fakescan-lab = "fakescan.lab:main"
fakescan-ctl = "fakescan.ctl:main"
fakescan-mcp = "fakescan.mcp_server:main"
fakescan-refs = "fakescan.wsd_docs:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fakescan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs a running fakescan on FAKESCAN_BASE_URL (default http://127.0.0.1:3920)",
  "local: starts fakescan itself and walks the scan matrix (no Imaging install)",
]
