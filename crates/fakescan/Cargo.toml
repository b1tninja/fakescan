[package]
name = "fakescan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fake WSD scanner for Windows WIA and scan-path testing"
readme = "../../README.md"
keywords = ["scanner", "wsd", "wia", "testing", "windows"]
categories = ["command-line-utilities", "development-tools::testing"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
fax = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff"] }
jpeg-encoder = "0.7"
openjpeg2-pure-rs = "0.1"
qrcode = { version = "0.14.1", features = ["image"] }
quick-xml = "0.37"
tiff = "0.11"
png = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# System-tray icon inside the daemon (Windows only; the dependencies below are cfg(windows)).
default = ["tray"]
tray = ["dep:tray-icon", "dep:native-windows-gui"]

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.19", default-features = false, optional = true }
# Only for its safe thread message pump + Timer (tray-icon needs a Win32 message loop and the
# workspace forbids unsafe). No GUI controls are created.
native-windows-gui = { version = "1.0.13", default-features = false, features = ["notice", "message-window"], optional = true }

[build-dependencies]
# Windows .ico + VERSIONINFO for fakescan.exe (build.rs is a no-op elsewhere).
winresource = "0.1"

[dev-dependencies]
http-body-util = "0.1"
rqrr = "0.11.0"
tower = { version = "0.5", features = ["util"] }
