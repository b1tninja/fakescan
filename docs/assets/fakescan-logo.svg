    </g>
    <circle cx="78" cy="58" r="1.6" fill="#a5f3fc" opacity="0.9"/>
    <circle cx="186" cy="70" r="1.4" fill="#7dd3fc" opacity="0.8"/>
    <circle cx="64" cy="96" r="1.2" fill="#e0f2fe" opacity="0.7"/>
    <circle cx="192" cy="108" r="1.5" fill="#67e8f9" opacity="0.85"/>
    <circle cx="96" cy="46" r="1" fill="#bae6fd" opacity="0.6"/>
    <rect x="66" y="176" width="8" height="8" rx="2" fill="#334155"/>
