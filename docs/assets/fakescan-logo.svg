<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="fakescan">
  <title>fakescan</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243044"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3348"/>
      <stop offset="0.45" stop-color="#152433"/>
      <stop offset="1" stop-color="#0c141c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fcff"/>
      <stop offset="1" stop-color="#d7eef8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#f0fdff"/>
      <stop offset="0.82" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="beamglow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .scan { fill: #3f4854; }
      @media (prefers-color-scheme: dark) {
        .scan { fill: #e6e8eb; }
      }
    </style>
  </defs>
  <g transform="translate(8 20) scale(0.78125)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <rect x="46" y="150" width="164" height="64" rx="16" fill="url(#chassis)"/>
    <rect x="58" y="138" width="140" height="20" rx="7" fill="#0b1520"/>
    <rect x="70" y="142" width="116" height="8" rx="3" fill="#164e63" opacity="0.85"/>
    <path fill="url(#page)" d="M88 140 L88 64 Q88 50 102 50 L148 50 L170 72 L170 140 Z"/>
    <path fill="#9ec9de" d="M148 50 L148 72 L170 72 Z"/>
    <path fill="#f7fcff" opacity="0.55" d="M148 50 L170 72 L156 72 Q148 72 148 64 Z"/>
    <rect x="100" y="78" width="52" height="3.5" rx="1.5" fill="#0284c7" opacity="0.55"/>
    <rect x="100" y="88" width="38" height="3.5" rx="1.5" fill="#0284c7" opacity="0.38"/>
    <rect x="100" y="122" width="46" height="3.5" rx="1.5" fill="#0284c7" opacity="0.35"/>
    <rect x="100" y="132" width="30" height="3.5" rx="1.5" fill="#0284c7" opacity="0.25"/>
    <rect x="64" y="102" width="128" height="22" fill="#22d3ee" opacity="0.22"/>
    <g filter="url(#beamglow)">
