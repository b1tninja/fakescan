          font-family="Segoe UI, ui-sans-serif, system-ui, sans-serif"
          font-weight="700" font-size="26" letter-spacing="-0.04em" fill="#e0f2fe">Fs</text>
    <circle cx="186" cy="180" r="7" fill="#67e8f9" opacity="0.28"/>
    <circle cx="186" cy="180" r="3.2" fill="#a5f3fc"/>
  </g>
  <text x="236" y="154"
        font-family="Segoe UI, ui-sans-serif, system-ui, sans-serif"
        font-weight="700" font-size="84" letter-spacing="-0.03em">
